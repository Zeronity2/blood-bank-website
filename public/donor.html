<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Become a Donor - Blood Bank</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff0f0;
    }

    header {
      background-color: #d40000;
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 650px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
    }

    h2 {
      text-align: center;
      color: #d40000;
      margin-bottom: 25px;
    }

    form label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    form input,
    form select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    form button {
      width: 100%;
      background: #d40000;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    form button:hover {
      background: #b00000;
    }

    footer {
      background-color: #d40000;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 100px;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Blood Bank</h1>

    <nav>
       <a href="index.html">Home</a>
      <a href="donor.html">Become Donor</a>
      <a href="find-donor.html">Find Donor</a>
      <a href="enquiry.html">Enquiry</a>
      <a href="bloodgroups.html">Blood Groups</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="login.html">Login</a>
    </nav>
  </header>


  <!-- Donor Registration -->
  <div class="container">

    <h2>Become a Blood Donor</h2>

    <form id="donorForm">

      <!-- Full Name -->
      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Enter your full name"
        required
      >

      <!-- Age -->
      <label for="age">Age</label>
      <input
        type="number"
        id="age"
        name="age"
        min="18"
        max="65"
        placeholder="Enter your age"
        required
      >

      <!-- Gender -->
      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="">--Select--</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>

      <!-- Blood Group -->
      <label for="bloodGroup">Blood Group</label>
      <select id="bloodGroup" name="bloodGroup" required>
        <option value="">--Select--</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
      </select>

      <!-- Phone -->
      <label for="phone">Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="Enter your phone number"
        required
      >

      <!-- Email -->
      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      >

      <!-- City -->
      <label for="city">City</label>
      <input
        type="text"
        id="city"
        name="city"
        placeholder="Enter your city"
        required
      >

      <!-- Last Donation -->
      <label for="lastDonation">Last Donation Date</label>
      <input
        type="date"
        id="lastDonation"
        name="lastDonation"
      >

      <!-- Availability -->
      <label for="available">Available to Donate?</label>
      <select id="available" name="available" required>
        <option value="">--Select--</option>
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <button type="submit">Register as Donor</button>

    </form>
  </div>


  <!-- Footer -->
  <footer>
    &copy; 2025 Blood Bank. All Rights Reserved.
  </footer>


  <!-- JavaScript -->
  <script>
  document.getElementById("donorForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const donorData = {
      name: document.getElementById("name").value,
      age: Number(document.getElementById("age").value),
      gender: document.getElementById("gender").value,
      bloodGroup: document.getElementById("bloodGroup").value,
      phone: document.getElementById("phone").value,
      email: document.getElementById("email").value,
      city: document.getElementById("city").value,
      lastDonation: document.getElementById("lastDonation").value || null,
      available: document.getElementById("available").value === "true"
    };

    try {
      const response = await fetch("/api/donors", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(donorData)
      });

      const result = await response.json();

      if (result.success) {
        alert("Donor registered successfully!");
        document.getElementById("donorForm").reset();
      } else {
        alert(result.message || "Failed to register donor.");
      }

    } catch (error) {
      console.error("Error:", error);
      alert("Something went wrong. Please try again.");
    }
  });
  </script>

</body>
</html>
