<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url(images/contact.jpg);
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background-color: #cc0000; 
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #000;
    }

    .container {
      max-width: 600px;
      margin: 80px auto;
      background-color: rgba(0, 0, 0, 0.6);
      padding: 30px;
      border-radius: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    form input, form textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    form button {
      margin-top: 25px;
      padding: 12px 20px;
      background-color: #ff4d4d;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    form button:hover {
      background-color: #e60000;
    }

    @media (max-width: 768px) {
      .nav-links {
        flex-direction: column;
        align-items: flex-end;
      }

      .container {
        margin: 120px 20px;
      }
    }
  </style>
</head>
<body>

  
  <div class="header">
    <div class="logo">Blood Bank</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="donor.html">
        Become Donor
      </a>

      <a href="find-donor.html">
        Find Donor
      </a>

      <a href="request-blood.html">
        Request Blood
      </a>

      <a href="enquiry.html">
        Enquiry
      </a>

      <a href="bloodgroups.html">
        Blood Groups
      </a>

      <a href="gallery.html">
        Gallery
      </a>

      <a href="contact.html">
        Contact
      </a>

      <a href="login.html">
        Login
      </a>
    </div>
  </div>

  
  <div class="container">
    <h1>Contact Us</h1>
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="subject">Subject</label>
      <input type="text" id="subject" name="subject" required />

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send Message</button>
    </form>
  </div>

</body>
</html>
