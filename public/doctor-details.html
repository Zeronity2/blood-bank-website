<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doctor Details</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-image: url(images/doctor.webp); 
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .header-back {
      position: absolute;
      top: 20px;
      left: 20px;
      background-color: white;
      color: black;
      padding: 8px 16px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .container {
      text-align: center;
      padding: 120px 20px 40px;
      background-color: rgba(0, 0, 0, 0.6);
      max-width: 900px;
      margin: auto;
      border-radius: 10px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 30px;
    }

    .doctor-list {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 30px;
    }

    .doctor-card {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 10px;
      width: 250px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .doctor-card h3 {
      margin-top: 10px;
      color: #ff4d4d;
    }

    .signature-section {
      margin-top: 50px;
    }

    .signature-section img {
      width: 200px;
      height: auto;
      margin-top: 10px;
      border: 2px solid #fff;
      border-radius: 5px;
    }

    .signature-section p {
      margin-top: 10px;
      font-style: italic;
    }

    @media (max-width: 768px) {
      .doctor-list {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <a href="index.html" class="header-back">Back</a>

  <div class="container">
    <h1>Doctor Details</h1>

    <div class="doctor-list">
      <div class="doctor-card">
        <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Doctor" width="100" />
        <h3>Dr. Priya Sharma</h3>
        <p>Blood Specialist</p>
      </div>
      <div class="doctor-card">
        <img src="https://www.w3schools.com/howto/img_avatar2.png" alt="Doctor" width="100" />
        <h3>Dr. Aman Verma</h3>
        <p>Surgeon</p>
      </div>
      <div class="doctor-card">
        <img src="https://www.w3schools.com/howto/img_avatar.png" alt="Doctor" width="100" />
        <h3>Dr. Meera Joshi</h3>
        <p>Medical Officer</p>
      </div>
    </div>

    <div class="signature-section">
      <h2>Supervisor Signature</h2>
      <img src="images/signature.webp" alt="Signature" />
      <p>Dr. Rajeev Sharma<br>Chief Supervisor, Blood Bank</p>
    </div>
  </div>
</body>
</html>
