<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Enquiry Form</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff0f0;
    }

    header {
      background-color: #d40000;
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
    }

    h2 {
      text-align: center;
      color: #d40000;
      margin-bottom: 20px;
    }

    form label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }

    form input, form select, form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    form button {
      width: 100%;
      background: #d40000;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    form button:hover {
      background: #b00000;
    }

    footer {
      background-color: #d40000;
      color: white;
      text-align: center;
      padding: 15px;
      position: relative;
      bottom: 0;
      width: 100%;
      margin-top: 100px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Blood Bank</h1>
    <nav>
     <a href="index.html">Home</a>
      <a href="donor.html">
        Become Donor
      </a>

      <a href="find-donor.html">
        Find Donor
      </a>

      <a href="request-blood.html">
        Request Blood
      </a>

      <a href="enquiry.html">
        Enquiry
      </a>

      <a href="bloodgroups.html">
        Blood Groups
      </a>

      <a href="gallery.html">
        Gallery
      </a>

      <a href="contact.html">
        Contact
      </a>

      <a href="login.html">
        SignUp/Login
      </a>
    </nav>
  </header>

  <div class="container">
    <h2>Enquiry Form</h2>
    <form onsubmit="submitForm(event)">
      <label for="name">Full Name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required>

      <label for="blood">Blood Group</label>
      <select id="blood" required>
        <option value="">--Select--</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>
      </select>

      <label for="message">Message</label>
      <textarea id="message" rows="4" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </div>

  <footer>
    &copy; 2025 Blood Bank. All Rights Reserved.
  </footer>

 <script>
  async function submitForm(event) {
    event.preventDefault();

    const enquiryData = {
      name: document.getElementById('name').value,
      email: document.getElementById('email').value,
      phone: document.getElementById('phone').value,
      bloodGroup: document.getElementById('blood').value,
      message: document.getElementById('message').value
    };

    try {
      const response = await fetch('/api/enquiries', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(enquiryData)
      });

      const result = await response.json();

      if (result.success) {
        alert('Your enquiry has been submitted successfully!');
        document.querySelector('form').reset();
      } else {
        alert('Failed to submit enquiry.');
      }

    } catch (error) {
      console.error('Error:', error);
      alert('Something went wrong. Please try again.');
    }
  }
</script>
</body>
</html>
