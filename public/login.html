<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000; 
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 30px;
      background-color: #cc0000; 
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #fff;
    }

    .nav-links {
      display: flex;
      gap: 20px;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    .nav-links a:hover {
      color: #000;
    }

    .container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      box-shadow: 0 0 10px #cc0000;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    form label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    form input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    form button {
      margin-top: 25px;
      padding: 12px 20px;
      background-color: #cc0000;
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    form button:hover {
      background-color: #e60000;
    }

    .error {
      color: red;
      font-size: 14px;
      margin-top: 10px;
      display: none;
    }

    @media (max-width: 768px) {
      .nav-links {
        flex-direction: column;
        align-items: flex-end;
      }

      .container {
        margin: 100px 20px;
      }
    }
  </style>
</head>
<body>


  <div class="header">
    <div class="logo">Blood Bank</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="donor.html">
        Become Donor
      </a>

      <a href="find-donor.html">
        Find Donor
      </a>

      <a href="request-blood.html">
        Request Blood
      </a>

      <a href="enquiry.html">
        Enquiry
      </a>

      <a href="bloodgroups.html">
        Blood Groups
      </a>

      <a href="gallery.html">
        Gallery
      </a>

      <a href="contact.html">
        Contact
      </a>

      <a href="login.html">
        Login
      </a>
    </div>
  </div>

  
  <div class="container">
    <h1>Login</h1>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" required />

      <div class="error" id="errorMsg">Please enter both username and password.</div>

      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const username = form.username.value.trim();
      const password = form.password.value.trim();

      if (username === '' || password === '') {
        errorMsg.style.display = 'block';
      } else {
        errorMsg.style.display = 'none';
        alert("Login successful!");
        
      }
    });
  </script>

</body>
</html>
